services:
  laras:
    build: .
    image: laras-tts:latest
    ports:
      - "8080:8080"
    volumes:
      # isi: models/ (5 graf ONNX + tokenizer.model + bos_before_voice.npy),
      #      ref/suara.wav (10-15 detik), cache/
      - ./data:/data
    environment:
      LARAS_LANG: "id"
      TAKES: "3"        # kandidat per permintaan; dipilih otomatis tanpa ASR
      TEMP: "0.1"       # temperatur sampling latent
      EOS: "-4.0"       # ambang logit EOS
      THREADS: "0"      # 0 = semua inti
    # model + KV cache tinggal di RAM (~1,9 GB); beri ruang, jangan mepet
    mem_limit: 3g
    restart: unless-stopped

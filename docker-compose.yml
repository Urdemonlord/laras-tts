services:
  laras:
    build: .
    image: laras-tts:latest
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data          # isi: ref/suara.wav (10-15 detik)
    environment:
      LARAS_LANG: "id"
      TAKES: "3"
      USE_ASR: "1"
      POCKET_CFG: "hf://anak10thn/pocket-tts-indonesian/indonesian_6l.yaml@17257664e384561c957b02ac92edd1a24807f0e5"
    # worker butuh ~2,1 GB; batasi supaya tidak menabrak layanan lain
    mem_limit: 3g
    restart: unless-stopped

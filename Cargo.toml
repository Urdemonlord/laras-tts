[package]
name = "laras"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Laras — engine TTS Bahasa Indonesia yang CPU-first, self-hosted, dengan kloning suara"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Urdemonlord/laras-tts"
homepage = "https://github.com/Urdemonlord/laras-tts"
keywords = ["tts", "text-to-speech", "indonesian", "voice-cloning", "cpu"]
categories = ["web-programming::http-server", "multimedia::audio"]

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "io-util", "fs", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
regex = "1"

# Mesin inferensi native (fitur `onnx`) — CPU-only.
anyhow = { version = "1", optional = true }
ort = { version = "2.0.0-rc.15", optional = true, features = ["half"] }
half = { version = "2", optional = true }
hound = { version = "3.5", optional = true }
unicode-normalization = { version = "0.1", optional = true }
# Pemilih take berbasis ASR (whisper.cpp) — opsi A tanpa Python.
whisper-rs = { version = "0.12", optional = true }

[features]
default = []
# Port inferensi native: menggantikan worker Python dengan ONNX Runtime.
onnx = [
    "dep:anyhow",
    "dep:ort",
    "dep:half",
    "dep:hound",
    "dep:unicode-normalization",
]
# Seleksi take dengan mendengarkan hasil sintesis (butuh `onnx`).
asr = ["onnx", "dep:whisper-rs"]

[[bin]]
name = "laras_onnx"
path = "src/bin/laras_onnx.rs"
required-features = ["onnx"]

[[bin]]
name = "lufs"
path = "src/bin/lufs.rs"

[[bin]]
name = "asr_bench"
path = "src/bin/asr_bench.rs"
required-features = ["onnx", "asr"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

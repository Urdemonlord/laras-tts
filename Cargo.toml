[package]
name = "tts-gateway"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "HTTP gateway TTS Bahasa Indonesia: normalizer angka + chunking + worker Pocket TTS"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Urdemonlord/tts-gateway"
keywords = ["tts", "text-to-speech", "indonesian", "voice-cloning", "axum"]
categories = ["web-programming::http-server", "multimedia::audio"]

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "io-util", "fs", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
regex = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

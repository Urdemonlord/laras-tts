name: image

# Image dibangun di runner GitHub, bukan di VPS produksi: setiap base image
# Rust 1.9x ~1,2 GB dan setiap build gagal meninggalkan layer cache besar.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - ".github/workflows/image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login ke ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tentukan tag
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build (dan push kalau tag/dispatch)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build yang lolos belum tentu image yang jalan. Tanpa model ONNX, binary
      # harus tetap sampai tahap memuat model — kalau glibc/libstdc++ runtime
      # tidak cocok, prosesnya mati lebih awal dengan "GLIBC_2.xx not found".
      - name: Uji image bisa jalan
        env:
          # Semua nilai di bawah berasal dari context GitHub / metadata-action,
          # bukan input pengguna; dilewatkan via env agar tidak diinterpolasi shell.
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
          EVENT: ${{ github.event_name }}
        run: |
          set -eu
          if [ "$EVENT" = "pull_request" ]; then
            REF="$(printf '%s\n' "$TAGS" | head -n1)"
          else
            # Verifikasi artefak yang benar-benar sudah di-push, bukan build lokal.
            # `github.repository` bisa mengandung huruf besar; referensi image wajib lowercase.
            IMG="$(printf '%s' "$IMAGE" | tr '[:upper:]' '[:lower:]')"
            REF="$IMG@$DIGEST"
            docker pull "$REF" > /dev/null
          fi
          echo "image: $REF"

          echo "--- dependensi dinamis di dalam image"
          docker run --rm --entrypoint sh "$REF" -c '
            ldd /usr/local/bin/laras
            echo "glibc runtime: $(ldd --version | head -1)"
            echo "glibc diminta binary: $(strings /usr/local/bin/laras | grep -oE "GLIBC_2\.[0-9]+" | sort -uV | tail -1)"
            ! ldd /usr/local/bin/laras | grep -q "not found"
          '

          echo "--- jalankan tanpa model: harus gagal saat memuat model, bukan saat link"
          mkdir -p /tmp/kosong
          docker run --rm -e MODELS_DIR=/tmp/kosong -e CACHE_DIR=/tmp/cache "$REF" > /tmp/out.log 2>&1 || true
          tail -5 /tmp/out.log
          grep -q "gagal memuat model" /tmp/out.log
          ! grep -qE "GLIBC_[0-9.]+ not found|error while loading shared libraries" /tmp/out.log

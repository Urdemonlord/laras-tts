name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
      - run: cargo build --release

  rust-onnx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: onnx
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --features onnx -- -D warnings
      - run: cargo test --features onnx
      - run: cargo build --release --features onnx

  # Fitur `asr` mengompilasi whisper.cpp lewat cmake + bindgen.
  rust-asr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: asr
      - run: sudo apt-get update && sudo apt-get install -y cmake
      # libclang dari apt (versi baru) menghasilkan binding tanpa field
      # `greedy` yang masih dipakai whisper-rs 0.12, jadi build gagal dengan
      # E0609. Libclang bawaan paket pip sudah terbukti cocok.
      - run: pip install libclang
      - run: |
          LIBCLANG=$(python -c 'import clang, os; print(os.path.join(os.path.dirname(clang.__file__), "native"))')
          echo "LIBCLANG_PATH=$LIBCLANG" >> $GITHUB_ENV
      - run: cargo clippy --all-targets --features onnx,asr -- -D warnings
      - run: cargo test --features onnx,asr
      - run: cargo build --release --features onnx,asr

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check worker.py norm_id.py
      - run: python -c "import ast; [ast.parse(open(f).read()) for f in ('worker.py','norm_id.py')]"

  no-voice-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tolak berkas suara yang tidak sengaja ter-commit
        run: |
          found=$(git ls-files '*.wav' '*.mp3' '*.m4a' '*.ogg' '*.webm' | grep -v '^tests/fixtures/' || true)
          if [ -n "$found" ]; then
            echo "Berkas suara tidak boleh di-commit (lihat ETHICS.md):"
            echo "$found"
            exit 1
          fi

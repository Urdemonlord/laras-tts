name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Toolchain dikunci, bukan `@stable`: Rust 1.99 menambah lint clippy baru
      # (`chunks_exact_to_as_chunks`, `unnecessary_map_or`) yang bikin CI merah
      # tanpa ada perubahan kode. Versi ini sama dengan image Docker.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
      - run: cargo build --release

  rust-onnx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: onnx
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --features onnx -- -D warnings
      - run: cargo test --features onnx
      - run: cargo build --release --features onnx

  # Fitur `asr` mengompilasi whisper.cpp lewat cmake + bindgen.
  rust-asr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: asr
      - run: sudo apt-get update && sudo apt-get install -y cmake
      # libclang dari apt (versi baru) menghasilkan binding tanpa field
      # `greedy` yang masih dipakai whisper-rs 0.12, jadi build gagal dengan
      # E0609. Libclang bawaan paket pip sudah terbukti cocok.
      - run: pip install libclang
      - run: |
          LIBCLANG=$(python -c 'import clang, os; print(os.path.join(os.path.dirname(clang.__file__), "native"))')
          echo "LIBCLANG_PATH=$LIBCLANG" >> $GITHUB_ENV
      - run: cargo clippy --all-targets --features onnx,asr -- -D warnings
      - run: cargo test --features onnx,asr
      - run: cargo build --release --features onnx,asr

  # Aplikasi desktop memakai WebKitGTK, yang tidak ada di image `ubuntu-latest`
  # default. Yang diperiksa di sini: kode Rust-nya masih cocok dengan API Tauri
  # dan pustaka `laras` — bukan bundel .deb/AppImage.
  desktop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92.0"
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "desktop/src-tauri -> target"
      - name: Dependensi WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            librsvg2-dev libsoup-3.0-dev
      - run: cargo clippy --manifest-path desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo build --manifest-path desktop/src-tauri/Cargo.toml

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check worker.py norm_id.py
      - run: python -c "import ast; [ast.parse(open(f).read()) for f in ('worker.py','norm_id.py')]"
      # Skrip shell: sintaksnya sah, dan `--cek` benar-benar menolak direktori
      # kosong (kode keluar 1) — bukan diam-diam lolos.
      - name: Skrip shell
        run: |
          bash -n scripts/unduh-model.sh
          bash -n scripts/terbitkan-space.sh
          bash -n scripts/uji-image.sh
          if scripts/unduh-model.sh --cek --dir /tmp/kosong --tanpa-ref; then
            echo "::error::--cek seharusnya gagal untuk direktori kosong"
            exit 1
          fi
          # Skrip penerbit Space harus menolak jalan tanpa --user.
          if scripts/terbitkan-space.sh >/dev/null 2>&1; then
            echo "::error::terbitkan-space.sh seharusnya menolak tanpa --user"
            exit 1
          fi

  no-voice-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tolak berkas suara yang tidak sengaja ter-commit
        run: |
          # Dua pengecualian, keduanya sadar:
          #   tests/fixtures/ — berkas uji yang isinya bukan suara siapa pun
          #   landing/assets/ — tiga sampel demo yang disintesis Laras dari
          #     referensi Common Voice CC0; bukan rekaman pribadi (lihat ETHICS.md)
          found=$(git ls-files '*.wav' '*.mp3' '*.m4a' '*.ogg' '*.webm' \
            | grep -v -e '^tests/fixtures/' -e '^landing/assets/' || true)
          if [ -n "$found" ]; then
            echo "Berkas suara tidak boleh di-commit (lihat ETHICS.md):"
            echo "$found"
            exit 1
          fi

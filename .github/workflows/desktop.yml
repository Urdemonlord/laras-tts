name: Desktop

# Membangun aplikasi desktop di runner GitHub, lalu mengunggah binary-nya
# sebagai artefak. Tidak ada build desktop di VPS produksi: box itu hanya
# dipakai untuk menjalankan hasilnya.
#
# Paket .deb/AppImage belum dibuat di sini — itu butuh `tauri-cli` dan
# ditambahkan saat rilis, bukan di setiap push.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "src/**"
      - "Cargo.toml"
      - ".github/workflows/desktop.yml"

jobs:
  bangun:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92.0"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "desktop/src-tauri -> target"

      - name: Dependensi WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            librsvg2-dev libsoup-3.0-dev

      - name: Bangun (release)
        run: cargo build --release --manifest-path desktop/src-tauri/Cargo.toml

      - name: Uji mode kepala tanpa model
        # Tanpa teks, mode kepala harus menolak dengan kode 2 — membuktikan
        # argumen terbaca dan binary bisa jalan tanpa X server.
        run: |
          set +e
          ./desktop/src-tauri/target/release/laras-desktop --sintesis "" >/dev/null 2>&1
          kode=$?
          set -e
          echo "kode keluar: $kode"
          test "$kode" -eq 2

      - name: Ukuran dan tautan dinamis
        run: |
          ls -lh desktop/src-tauri/target/release/laras-desktop
          if ldd desktop/src-tauri/target/release/laras-desktop | grep -q "not found"; then
            echo "::error::ada pustaka yang tidak ditemukan"
            ldd desktop/src-tauri/target/release/laras-desktop | grep "not found"
            exit 1
          fi
          ldd desktop/src-tauri/target/release/laras-desktop | grep -E "webkit|onnx" | head -5

      - uses: actions/upload-artifact@v4
        with:
          name: laras-desktop-linux-x86_64
          path: desktop/src-tauri/target/release/laras-desktop
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------- windows
  # Artefak .exe untuk diuji di laptop pengguna. Tetap dibangun di runner,
  # tidak pernah di VPS produksi (box itu cuma 3,7 GB dan sudah pernah OOM).
  # WebView2 sudah tersedia di windows-latest, jadi tidak ada dependensi sistem
  # tambahan seperti libwebkit2gtk di Linux.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92.0"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "desktop/src-tauri -> target"

      - name: Bangun (release)
        run: cargo build --release --manifest-path desktop/src-tauri/Cargo.toml

      - name: Uji mode kepala tanpa model
        # Sama seperti job Linux: teks kosong harus ditolak dengan kode 2,
        # membuktikan argumen terbaca dan binary jalan tanpa jendela.
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ".\desktop\src-tauri\target\release\laras-desktop.exe" `
            -ArgumentList '--sintesis ""' -Wait -PassThru -NoNewWindow
          Write-Host "kode keluar: $($p.ExitCode)"
          if ($p.ExitCode -ne 2) { exit 1 }

      - name: Kumpulkan berkas
        # ONNX Runtime bisa ikut sebagai DLL; ambil semua yang ada di samping exe
        # supaya paketnya bisa dijalankan tanpa memasang apa pun.
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item .\desktop\src-tauri\target\release\laras-desktop.exe out\
          Get-ChildItem .\desktop\src-tauri\target\release -Filter *.dll -File -ErrorAction SilentlyContinue |
            Copy-Item -Destination out\
          Get-ChildItem out | Select-Object Name, Length | Format-Table

      - uses: actions/upload-artifact@v4
        with:
          name: laras-desktop-windows-x86_64
          path: out/
          if-no-files-found: error
          retention-days: 14
